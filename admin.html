<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>營運管理後台 V1.4.6</title>
<style>
:root{--bg:#f3f6fb;--panel:#fff;--text:#172033;--muted:#6b7280;--line:#e5e7eb;--primary:#0f5bd8;--primary-dark:#0a49b4;--success:#0f9d58;--danger:#d93025;--shadow:0 10px 30px rgba(18,38,63,.08);--radius:18px}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:1180px;margin:0 auto;padding:28px 18px 50px}
.header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}
h1{margin:0;font-size:28px}
.sub{color:var(--muted);font-size:14px;margin-top:5px}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;margin-bottom:18px}
.login{max-width:460px;margin:70px auto}
label{display:block;font-weight:700;margin:0 0 8px}
input,select{width:100%;padding:13px 14px;border:1px solid #d7dce3;border-radius:12px;font-size:15px;outline:none}
input:focus,select:focus{border-color:#78a9ff;box-shadow:0 0 0 4px rgba(15,91,216,.09)}
.btn{border:0;border-radius:12px;padding:13px 16px;font-size:15px;font-weight:800;cursor:pointer}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-light{background:#eef1f5;color:#374151}
.btn:disabled{opacity:.6;cursor:not-allowed}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{border:1px solid var(--line);border-radius:16px;padding:18px;background:#fff}
.card .name{font-weight:800;font-size:16px;margin-bottom:6px}
.card .stock{font-size:28px;font-weight:900;color:var(--primary);margin:10px 0}
.card input{text-align:center;font-size:18px;font-weight:800}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:11px 10px;text-align:center}
th{background:#f7f9fc;font-weight:800;position:sticky;top:0}
td.note{text-align:left;max-width:260px}
.table-wrap{max-height:480px;overflow:auto;border:1px solid var(--line);border-radius:14px}
.hidden{display:none!important}
.status{margin-top:12px;padding:12px 14px;border-radius:10px;font-size:14px;display:none}
.status.ok{display:block;background:#edf9f2;color:#176a3a}
.status.err{display:block;background:#fff1f0;color:#a1261d}
.status.info{display:block;background:#eef4ff;color:#315a9b}
.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#eef3fb;color:#0f5bd8;font-size:12px;font-weight:800}
.loading-row{padding:24px;text-align:center;color:var(--muted)}
@media(max-width:850px){.cards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.cards{grid-template-columns:1fr}h1{font-size:23px}}
</style>
</head>
<body>
<div class="wrap">
  <div id="loginView" class="panel login">
    <h1>營運管理後台</h1>
    <div class="sub">外籍紙本申請書申請工具 V1.4.6</div>
    <div style="height:20px"></div>
    <label for="password">管理密碼</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="請輸入管理密碼">
    <button id="loginBtn" class="btn btn-primary" style="width:100%;margin-top:14px">登入後台</button>
    <div id="loginStatus" class="status"></div>
  </div>

  <div id="adminView" class="hidden">
    <div class="header">
      <div>
        <h1>營運管理後台</h1>
        <div class="sub">庫存管理 × 申請紀錄</div>
      </div>
      <div>
        <span class="badge">V1.4.6</span>
        <a href="./" class="btn btn-light" style="margin-left:8px;text-decoration:none;display:inline-block">前往申請頁</a>
        <button id="logoutBtn" class="btn btn-light" style="margin-left:8px">登出</button>
      </div>
    </div>

    <section class="panel">
      <div class="toolbar">
        <div>
          <div style="font-size:19px;font-weight:900">目前庫存</div>
          <div class="sub">登入後先載入庫存，申請紀錄於背景分段載入</div>
        </div>
        <div>
          <button id="refreshStockBtn" class="btn btn-light">重新讀取庫存</button>
          <button id="saveStockBtn" class="btn btn-primary">儲存庫存</button>
        </div>
      </div>

      <div class="cards">
        <div class="card"><div class="name">🇮🇩 印尼文</div><div class="stock" id="display-id">—</div><input id="stock-id" type="number" min="0" step="1"></div>
        <div class="card"><div class="name">🇵🇭 菲律賓 / 英文</div><div class="stock" id="display-ph">—</div><input id="stock-ph" type="number" min="0" step="1"></div>
        <div class="card"><div class="name">🇹🇭 泰文</div><div class="stock" id="display-th">—</div><input id="stock-th" type="number" min="0" step="1"></div>
        <div class="card"><div class="name">🇻🇳 越南文</div><div class="stock" id="display-vn">—</div><input id="stock-vn" type="number" min="0" step="1"></div>
      </div>
      <div id="stockStatus" class="status info">正在載入庫存…</div>
    </section>

    <section class="panel">
      <div class="toolbar">
        <div>
          <div style="font-size:19px;font-weight:900">申請紀錄</div>
          <div class="sub">登入後背景載入最近 200 筆，可依門市篩選</div>
        </div>
        <div style="min-width:220px">
          <select id="storeFilter">
            <option value="">全部門市</option>
          </select>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>申請時間</th><th>門市</th><th>印尼</th><th>菲律賓/英文</th><th>泰文</th><th>越南文</th><th>總張數</th><th>備註</th></tr>
          </thead>
          <tbody id="requestRows"><tr><td colspan="8" class="loading-row">登入後背景載入申請紀錄</td></tr></tbody>
        </table>
      </div>
      <div id="requestStatus" class="status"></div>
    </section>
  </div>
</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbzV63nmCEnvD4InnB4SfFDdoVpr9Hr2bibZbcpz5WnJof-kAPu4fy2k4a3BraRI5zv44g/exec";
const LOGIN_TIMEOUT_MS=20000;
const STOCK_TIMEOUT_MS=15000;
const REQUESTS_TIMEOUT_MS=25000;
const SAVE_TIMEOUT_MS=30000;

let adminToken="";
let allRequests=[];

function showStatus(id,type,msg){
  const el=document.getElementById(id);
  el.className='status '+type;
  el.textContent=msg;
}
function clearStatus(id){document.getElementById(id).className='status'}

async function postJson(payload, timeoutMs){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(), timeoutMs);

  try{
    const res=await fetch(API_URL,{
      method:"POST",
      redirect:"follow",
      mode:"cors",
      cache:"no-store",
      credentials:"omit",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify(payload),
      signal:controller.signal
    });

    const text=await res.text();

    if(!res.ok) throw new Error("後台服務 HTTP 錯誤："+res.status);

    try{
      return JSON.parse(text);
    }catch(_){
      const normalized=text.trim().toLowerCase();

      if(normalized.startsWith("<!doctype")||normalized.startsWith("<html")||normalized.includes("<body")){
        if(normalized.includes("accounts.google.com")||normalized.includes("sign in")||normalized.includes("登入")){
          throw new Error("Apps Script 回傳 Google 登入頁，請確認 Web App 權限為「任何人」。");
        }
        if(normalized.includes("permission")||normalized.includes("權限")||normalized.includes("access denied")){
          throw new Error("Apps Script 回傳權限頁，請確認執行身分為「我」、存取權限為「任何人」。");
        }
        throw new Error("Apps Script 回傳 HTML 而不是 JSON，請確認 /exec 對應最新部署版本。");
      }

      throw new Error("後台服務回傳非 JSON 內容："+text.slice(0,120));
    }
  }catch(err){
    if(err.name==="AbortError") throw new Error("連線逾時");
    if(err instanceof TypeError) throw new Error("無法連線 Apps Script");
    throw err;
  }finally{
    clearTimeout(timer);
  }
}

async function api(action,body={},timeoutMs=15000){
  return postJson({action,token:adminToken,...body},timeoutMs);
}

function applyStock(stock){
  ['id','ph','th','vn'].forEach(k=>{
    const v=Number(stock?.[k]||0);
    document.getElementById('display-'+k).textContent=v.toLocaleString('zh-TW');
    document.getElementById('stock-'+k).value=v;
  });
}

function applyRequests(requests){
  allRequests=requests||[];
  buildStoreFilter();
  renderRequests();
}

async function login(){
  clearStatus('loginStatus');
  const password=document.getElementById('password').value;
  if(!password) return showStatus('loginStatus','err','請輸入管理密碼');

  const btn=document.getElementById('loginBtn');
  btn.disabled=true;
  btn.textContent='登入中…';
  showStatus('loginStatus','info','正在驗證管理密碼…');

  try{
    // V1.4.6: login ONLY authenticates and returns token.
    const data=await postJson({action:"admin_login",password},LOGIN_TIMEOUT_MS);
    if(!data.ok) throw new Error(data.message||'登入失敗');

    adminToken=data.token;
    sessionStorage.setItem('adminToken',adminToken);

    document.getElementById('loginView').classList.add('hidden');
    document.getElementById('adminView').classList.remove('hidden');

    // Segment loading: stock first, requests in background.
    loadStock();
    loadRequests();
  }catch(err){
    const msg=err.message==="連線逾時"
      ? "登入驗證逾時，Google Apps Script 可能正在冷啟動，請再試一次。"
      : err.message;
    showStatus('loginStatus','err',msg);
  }finally{
    btn.disabled=false;
    btn.textContent='登入後台';
  }
}

async function loadStock(){
  showStatus('stockStatus','info','正在載入庫存…');
  try{
    const data=await api('admin_get_stock',{},STOCK_TIMEOUT_MS);
    if(!data.ok) throw new Error(data.message||'庫存讀取失敗');
    applyStock(data.stock);
    clearStatus('stockStatus');
  }catch(err){
    const msg=err.message==="連線逾時"
      ? "庫存讀取逾時，可按「重新讀取庫存」再試。"
      : err.message;
    showStatus('stockStatus','err',msg);
  }
}

async function loadRequests(){
  showStatus('requestStatus','info','正在背景載入申請紀錄…');
  document.getElementById('requestRows').innerHTML='<tr><td colspan="8" class="loading-row">正在載入申請紀錄…</td></tr>';

  try{
    const data=await api('admin_get_requests',{limit:200},REQUESTS_TIMEOUT_MS);
    if(!data.ok) throw new Error(data.message||'申請紀錄讀取失敗');
    applyRequests(data.requests);
    clearStatus('requestStatus');
  }catch(err){
    const msg=err.message==="連線逾時"
      ? "申請紀錄載入逾時，但不影響庫存管理；重新整理頁面後會再嘗試。"
      : err.message;
    showStatus('requestStatus','err',msg);
    document.getElementById('requestRows').innerHTML='<tr><td colspan="8" class="loading-row">申請紀錄尚未載入</td></tr>';
  }
}

async function saveStock(){
  clearStatus('stockStatus');

  const stock={};
  ['id','ph','th','vn'].forEach(k=>{
    stock[k]=Math.max(
      0,
      parseInt(document.getElementById('stock-'+k).value||'0',10)
    );
  });

  const btn=document.getElementById('saveStockBtn');
  btn.disabled=true;
  btn.textContent='儲存中…';
  showStatus('stockStatus','info','正在寫入 Google Sheet…');

  try{
    let data;

    try{
      data=await api('admin_update_stock',{stock},SAVE_TIMEOUT_MS);
    }catch(err){
      if(err.message!=="連線逾時") throw err;

      // Apps Script cold-start may exceed first timeout.
      showStatus('stockStatus','info','第一次寫入較慢，正在自動重試一次…');
      data=await api('admin_update_stock',{stock},SAVE_TIMEOUT_MS);
    }

    if(!data.ok) throw new Error(data.message||'儲存失敗');

    applyStock(data.stock);
    showStatus('stockStatus','ok','庫存已更新');

  }catch(err){
    const msg=err.message==="連線逾時"
      ? "庫存儲存仍逾時。請稍後再試；若 Sheet 已更新，代表只是回應較慢。"
      : err.message;

    showStatus('stockStatus','err',msg);

  }finally{
    btn.disabled=false;
    btn.textContent='儲存庫存';
  }
}

function buildStoreFilter(){
  const select=document.getElementById('storeFilter');
  const current=select.value;
  const stores=[...new Set(allRequests.map(r=>r.store).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-Hant'));
  select.innerHTML='<option value="">全部門市</option>'+stores.map(s=>`<option>${escapeHtml(s)}</option>`).join('');
  if(stores.includes(current)) select.value=current;
}

function renderRequests(){
  const filter=document.getElementById('storeFilter').value;
  const rows=filter?allRequests.filter(r=>r.store===filter):allRequests;

  if(!rows.length){
    document.getElementById('requestRows').innerHTML='<tr><td colspan="8" class="loading-row">目前沒有申請紀錄</td></tr>';
    return;
  }

  document.getElementById('requestRows').innerHTML=rows.map(r=>`
    <tr>
      <td>${escapeHtml(r.time||'')}</td>
      <td>${escapeHtml(r.store||'')}</td>
      <td>${num(r.id)}</td>
      <td>${num(r.ph)}</td>
      <td>${num(r.th)}</td>
      <td>${num(r.vn)}</td>
      <td><strong>${num(r.total)}</strong></td>
      <td class="note">${escapeHtml(r.note||'')}</td>
    </tr>`).join('');
}

function num(v){return Number(v||0).toLocaleString('zh-TW')}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

document.getElementById('loginBtn').addEventListener('click',login);
document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
document.getElementById('saveStockBtn').addEventListener('click',saveStock);
document.getElementById('refreshStockBtn').addEventListener('click',loadStock);
document.getElementById('storeFilter').addEventListener('change',renderRequests);
document.getElementById('logoutBtn').addEventListener('click',()=>{
  sessionStorage.removeItem('adminToken');
  adminToken='';
  document.getElementById('adminView').classList.add('hidden');
  document.getElementById('loginView').classList.remove('hidden');
  document.getElementById('password').value='';
});

(async()=>{
  const saved=sessionStorage.getItem('adminToken');
  if(!saved) return;

  adminToken=saved;

  // Do not block on full bootstrap. Validate token via stock call first.
  try{
    const data=await api('admin_get_stock',{},STOCK_TIMEOUT_MS);
    if(!data.ok) throw new Error();

    document.getElementById('loginView').classList.add('hidden');
    document.getElementById('adminView').classList.remove('hidden');

    applyStock(data.stock);
    clearStatus('stockStatus');
    loadRequests();
  }catch(_){
    sessionStorage.removeItem('adminToken');
    adminToken='';
  }
})();
</script>
</body>
</html>
